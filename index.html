<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME OVER — la collana</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Over">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --nero:#0b0b0b; --rosso:#e8342a; --magenta:#ff2fd6; --ciano:#29e0f2;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:#fff;color:var(--nero);
    font-family:system-ui,-apple-system,sans-serif;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    overflow-x:hidden;position:relative;
  }
  .px{font-family:'Press Start 2P',monospace}

  /* pallini fluttuanti come in copertina */
  .dot{position:absolute;border-radius:50%;background:var(--nero);pointer-events:none;z-index:0}
  .dot.anello{background:none;border:3px solid var(--nero)}
  @keyframes va{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .dot{animation:va 6s ease-in-out infinite}

  header{margin:52px 0 10px;text-align:center;z-index:1}
  h1{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(2rem,9vw,3.4rem);line-height:1.25;
    color:var(--rosso);
    text-shadow:-3px 0 var(--magenta), 3px 0 var(--ciano);
    letter-spacing:.02em;
  }
  header p{margin-top:16px;font-size:.85rem;opacity:.6;letter-spacing:.14em;text-transform:uppercase}

  main{width:min(92vw,460px);margin:34px 0 auto;display:flex;flex-direction:column;gap:16px;z-index:1}
  .livello{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--nero);
    border:3px solid var(--nero);border-radius:18px;padding:18px;
    background:#fff;position:relative;
  }
  .livello:active{transform:translate(2px,2px)}
  .livello:focus-visible{outline:3px solid var(--ciano);outline-offset:3px}
  .livello svg{width:52px;height:52px;flex-shrink:0}
  .livello .tit{font-family:'Press Start 2P',monospace;font-size:.8rem;letter-spacing:.04em}
  .livello .sotto{font-size:.8rem;opacity:.6;margin-top:7px;line-height:1.4}
  .livello.attivo .tit{color:var(--rosso);text-shadow:-1.5px 0 var(--magenta),1.5px 0 var(--ciano)}
  .livello.bloccato{opacity:.38;pointer-events:none}
  .tag{
    position:absolute;top:-11px;right:14px;background:var(--nero);color:#fff;
    font-family:'Press Start 2P',monospace;font-size:.5rem;padding:5px 8px;border-radius:6px;
  }
  .livello.attivo .tag{background:var(--rosso)}

  footer{margin:44px 0 26px;text-align:center;z-index:1}
  footer .press{
    font-family:'Press Start 2P',monospace;font-size:.62rem;letter-spacing:.1em;
    animation:blink 1.6s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  footer .mafla{margin-top:16px;font-size:.72rem;letter-spacing:.5em;opacity:.55}

  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="dot" style="width:10px;height:10px;top:12%;left:12%;animation-delay:0s"></div>
<div class="dot anello" style="width:22px;height:22px;top:18%;right:10%;animation-delay:1.2s"></div>
<div class="dot" style="width:6px;height:6px;top:34%;left:22%;animation-delay:2s"></div>
<div class="dot anello" style="width:16px;height:16px;top:48%;right:18%;animation-delay:.6s"></div>
<div class="dot" style="width:8px;height:8px;bottom:26%;left:10%;animation-delay:1.7s"></div>
<div class="dot anello" style="width:26px;height:26px;bottom:14%;right:12%;animation-delay:.3s"></div>
<div class="dot" style="width:5px;height:5px;bottom:38%;right:32%;animation-delay:2.4s"></div>

<header>
  <h1>GAME<br>OVER</h1>
  <p>La collana per vincere la partita</p>
</header>

<main>
  <a class="livello attivo" href="allergia.html">
    <span class="tag">Livello 1</span>
    <img src="naso.png" alt="" width="52" height="52" style="flex-shrink:0">
    <span><span class="tit">ALLERGIA</span><br><span class="sotto">Il Diario del Reset: 21 giorni, digitale</span></span>
  </a>

  <a class="livello" href="pianopiano.html">
    <span class="tag">Livello 2</span>
    <svg viewBox="0 0 48 48" fill="none" stroke="#0b0b0b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M27 4v4h5a5.5 5.5 0 0 1 0 11H16a5.5 5.5 0 0 0 0 11h16a5.5 5.5 0 0 1 0 11H20a5 5 0 0 0-5 4"/>
      <path d="M19 13.5h9M29 24.5H19M29 35.5h-8" stroke-width="3"/>
    </svg>
    <span><span class="tit">INTESTINO</span><br><span class="sotto">Piano Piano: mangia con calma</span></span>
  </a>

  <a class="livello bloccato" href="#" aria-disabled="true">
    <span class="tag">Presto</span>
    <svg viewBox="0 0 48 48" fill="none" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 44v-6c-5-3-8-9-8-15C8 13 15 5 24 5c9 0 16 7 16 16l3 6-4 1v4c0 2-2 4-4 4h-3v8"/>
      <path d="M17 21a4 4 0 0 1 3.5-6 5 5 0 0 1 9 .5 3.8 3.8 0 0 1 .5 7.3H19"/>
      <path d="M21 26.5q-1.6 2.8 0 4.2 1.6-1.4 0-4.2zM27 25.5q-1.6 2.8 0 4.2 1.6-1.4 0-4.2z"/>
    </svg>
    <span><span class="tit">ANSIA</span><br><span class="sotto">In arrivo con il prossimo libro</span></span>
  </a>

  <a class="livello bloccato" href="#" aria-disabled="true">
    <span class="tag">Presto</span>
    <svg viewBox="0 0 48 48" fill="none" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="16" width="28" height="16" rx="4"/>
      <path d="M36 21h5v6h-5M13 21v6"/>
    </svg>
    <span><span class="tit">STANCHEZZA</span><br><span class="sotto">In arrivo con il prossimo libro</span></span>
  </a>
</main>

<footer>
  <p class="press">PRESS START ▲</p>
  <p class="mafla">MAFLA</p>
</footer>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
</body>
</html>
